replicaCount: 2

autoscaling:
  enabled: false

image:
  repository: kseniasharapova/user-app:1.0.0
  pullPolicy: IfNotPresent
  tag: "user-app"

nameOverride: "user-app"
fullnameOverride: "user-app"

podLabels: {
  "app": "user-app"
}
service:
  type: ClusterIP
  port: 8000

httpRoute:
  enabled: false

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: arch.homework
      paths:
        - path: /
          pathType: Prefix

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false
auth:
  enablePostgresUser: true
  username: "dXNlcg=="
  password: "MTIzNDU="
  postgresPassword: "dXNlcg=="

database:
  url: "jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"

postgresql:
  image:
    registry: ""                  # Пустое значение, так как образ локальный
    repository: my-local-postgres # Имя нашего собранного образа
    tag: "16"                     # Тег нашего образа
    pullPolicy: IfNotPresent      # Важно! Говорит Kubelet брать локальный образ

  containerExtraEnv:
    - name: POSTGRES_PASSWORD
      value: "SuperSecurePostgresPassword123"
    - name: POSTGRES_USER
      value: "postgres"
    - name: POSTGRES_DB
      value: "mydb"

  auth:
    database: "mydb"
    postgresPassword: "SuperSecurePostgresPassword123"
    username: "postgres"
    password: "SuperSecurePostgresPassword123"

  primary:
    persistence:
      enabled: false  # Диски отключены для мгновенного старта
  architecture: "standalone"
